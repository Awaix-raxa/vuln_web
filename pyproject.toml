[project]
name = "tem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "locus-x64", email = "elirazamumtaz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
tem = "tem:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
